name: Redteam unpack (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack redteam zip and commit
        run: |
          set -euo pipefail
          ZIP="push-ava-unified-redteam.zip"
          test -f "$ZIP"
          unzip -l "$ZIP"
          unzip -o "$ZIP"
          rm -f "$ZIP"
          rm -f .github/workflows/redteam-unpack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "fix(redteam): signed scope tokens, history recall re-verifies chain fresh from disk and serves only verified prefix, single-timestamp entries + tests, SQL migration 003 recall chain check (repo file only)"
          git push
